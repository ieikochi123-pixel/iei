<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEI Booking Administration Dashboard</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:30px;
    color:#333;
}

.dashboard-container{
    max-width:1300px;
    margin:auto;
}

.dashboard-title{
    text-align:center;
    margin-bottom:30px;
}

.dashboard-title h1{
    color:#0c3c60;
    margin-bottom:10px;
}

.gold-line{
    width:70px;
    height:4px;
    background:#f1b434;
    margin:auto;
}

.top-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.refresh-btn{
    background:#f1b434;
    color:#0c3c60;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.stats-card{
    background:white;
    border-top:4px solid #f1b434;
    border-radius:8px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.stats-number{
    font-size:30px;
    font-weight:bold;
    color:#0c3c60;
}

.table-wrapper{
    background:white;
    border-top:4px solid #f1b434;
    border-radius:8px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
    overflow-x:auto;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0c3c60;
    color:white;
    padding:14px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

td:last-child{
    white-space:nowrap;
}

tr:hover{
    background:#f8f8f8;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.approved{
    background:#d4edda;
    color:#155724;
}

.rejected{
    background:#f8d7da;
    color:#721c24;
}

.loading,
.no-data{
    text-align:center;
    padding:20px;
    color:#777;
}

.approve-btn{
    background:#137333;
    color:white;
    border:none;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
    margin-right:4px;
    font-weight:bold;
    font-size:12px;
    white-space:nowrap;
}

.reject-btn{
    background:#c5221f;
    color:white;
    border:none;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
    white-space:nowrap;
}

.delete-btn{
    background:#5f6368;
    color:white;
    border:none;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    margin-left:4px;
    font-size:12px;
    white-space:nowrap;
}

.delete-btn:hover{
    background:#3c4043;
}
.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:20px;
}

/* ---- Calendar styles ---- */

.calendar-wrapper{
    background:#ffffff;
    border-top:4px solid #f1b434;
    border:1px solid #e5e7eb;
    border-top:4px solid #f1b434;
    border-radius:12px;
    padding:36px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
    margin-bottom:20px;
    max-width:1300px;
    margin-left:auto;
    margin-right:auto;
}

.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:8px;
}

.calendar-nav{
    display:flex;
    align-items:center;
    gap:8px;
}

.calendar-nav button{
    background:#f1b434;
    color:#0c3c60;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.calendar-nav button:hover{
    background:#e0a422;
}

.calendar-month-label{
    font-size:24px;
    font-weight:bold;
    color:#0c3c60;
    min-width:200px;
    text-align:center;
}

.facility-filter{
    padding:10px 14px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:15px;
}

.calendar-legend{
    display:flex;
    gap:20px;
    margin-bottom:18px;
    flex-wrap:wrap;
    font-size:14px;
    color:#333;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
}

.legend-swatch{
    width:18px;
    height:18px;
    border-radius:4px;
    display:inline-block;
}

.swatch-booked{ background:#f8d7da; border:1px solid #c5221f; }
.swatch-pending{ background:#fff3cd; border:1px solid #856404; }
.swatch-free{ background:#e6f4ea; border:1px solid #34a853; }

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.calendar-day-name{
    text-align:center;
    font-weight:bold;
    color:#0c3c60;
    padding:10px 0;
    font-size:15px;
}

.calendar-cell{
    min-height:130px;
    border-radius:8px;
    padding:10px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    cursor:default;
    position:relative;
}

.calendar-cell.empty{
    background:transparent;
    border:none;
}

.calendar-cell.day-free{
    background:#e6f4ea;
    border:1px solid #34a853;
}

.calendar-cell.day-pending{
    background:#fff3cd;
    border:1px solid #856404;
}

.calendar-cell.day-booked{
    background:#f8d7da;
    border:1px solid #c5221f;
    cursor:pointer;
}

.calendar-cell.day-pending{
    cursor:pointer;
}

.calendar-cell.today{
    box-shadow:0 0 0 2px #f1b434 inset;
}

.calendar-date-num{
    font-weight:bold;
    font-size:18px;
    color:#333;
}

.calendar-day-count{
    font-size:13px;
    margin-top:8px;
    color:#444;
    line-height:1.4;
}

.day-details{
    margin-top:18px;
    border-top:1px solid #e5e7eb;
    padding-top:18px;
    display:none;
}

.day-details.active{
    display:block;
}

.day-details h4{
    color:#0c3c60;
    margin:0 0 12px 0;
    font-size:20px;
}

.day-details-list{
    list-style:none;
    padding:0;
    margin:0;
}

.day-details-list li{
    padding:12px 14px;
    border-radius:6px;
    background:#f5f7fa;
    margin-bottom:8px;
    font-size:16px;
}

</style>
</head>

<body>
    <script>

if(
    localStorage.getItem("adminLoggedIn")
    !== "true"
){
    window.location.href =
        "admin-login.html";
}

</script>

<div class="dashboard-container">

    <div class="dashboard-title">
        <h1>IEI Booking Administration Dashboard</h1>
        <div class="gold-line"></div>
    </div>

    <div class="top-actions">

    <button
        class="refresh-btn"
        onclick="loadBookings()">
        Refresh Bookings
    </button>

    <button
        class="refresh-btn"
        onclick="logout()">
        Logout
    </button>

</div>

    <div class="stats-grid">

    <div class="stats-card">
        <h3>Total Bookings</h3>
        <div class="stats-number" id="totalBookings">0</div>
    </div>

    <div class="stats-card">
        <h3>Pending</h3>
        <div class="stats-number" id="pendingBookings">0</div>
    </div>

    <div class="stats-card">
        <h3>Approved</h3>
        <div class="stats-number" id="approvedBookings">0</div>
    </div>

    <div class="stats-card">
        <h3>Rejected</h3>
        <div class="stats-number" id="rejectedBookings">0</div>
    </div>

</div>

    <!-- ---- Calendar View ---- -->
    <div class="calendar-wrapper">

        <div class="calendar-header">

            <div class="calendar-nav">
                <button onclick="changeMonth(-1)">&laquo; Prev</button>
                <div class="calendar-month-label" id="calendarMonthLabel">Month Year</div>
                <button onclick="changeMonth(1)">Next &raquo;</button>
            </div>

            <select class="facility-filter" id="facilityFilter" onchange="renderCalendar()">
                <option value="all">All Facilities</option>
            </select>

        </div>

        <div class="calendar-legend">
            <div class="legend-item"><span class="legend-swatch swatch-free"></span> Unbooked / Available</div>
            <div class="legend-item"><span class="legend-swatch swatch-pending"></span> Pending Approval</div>
            <div class="legend-item"><span class="legend-swatch swatch-booked"></span> Booked (Approved)</div>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- day names + cells injected by JS -->
        </div>

        <div class="day-details" id="dayDetails">
            <h4 id="dayDetailsTitle">Bookings</h4>
            <ul class="day-details-list" id="dayDetailsList"></ul>
        </div>

    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Reference</th>
                    <th>Facility</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Booking Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookingTable">

                <tr>
                    <td colspan="8" class="loading">
                        Loading bookings...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

    // ---- Global state ----
    let allBookings = [];
    let calendarDate = new Date();
    calendarDate.setDate(1);

    function logout(){

    localStorage.removeItem(
        "adminLoggedIn"
    );

    window.location.href =
        "admin-login.html";
}


async function loadBookings() {

    try {

        const response = await fetch(
            "/api/bookings"
        );

        const bookings = await response.json();

        allBookings = bookings || [];

        const table = document.getElementById("bookingTable");

        let pendingCount = 0;
        let approvedCount = 0;
        let rejectedCount = 0;

        table.innerHTML = "";

        if (bookings.length === 0) {

            document.getElementById("totalBookings").innerText = 0;
            document.getElementById("pendingBookings").innerText = 0;
            document.getElementById("approvedBookings").innerText = 0;
            document.getElementById("rejectedBookings").innerText = 0;

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="no-data">
                        No bookings found
                    </td>
                </tr>
            `;

            populateFacilityFilter();
            renderCalendar();

            return;
        }

        bookings.forEach(booking => {

            let statusClass = "pending";

            if (
                !booking.status ||
                booking.status.toLowerCase() === "pending"
            ) {
                pendingCount++;
                statusClass = "pending";
            }

            if (
                booking.status &&
                booking.status.toLowerCase() === "approved"
            ) {
                approvedCount++;
                statusClass = "approved";
            }

            if (
                booking.status &&
                booking.status.toLowerCase() === "rejected"
            ) {
                rejectedCount++;
                statusClass = "rejected";
            }

            const bookingDate =
                booking.booking_date ||
                booking.start_date ||
                "-";

            table.innerHTML += `
                <tr>

                    <td>${booking.booking_ref || "-"}</td>

                    <td>${booking.facility || "-"}</td>

                    <td>${booking.name || "-"}</td>

                    <td>${booking.phone || "-"}</td>

                    <td>${booking.email || "-"}</td>

                    <td>${bookingDate}</td>

                    <td>
                        <span class="status ${statusClass}">
                            ${booking.status || "Pending"}
                        </span>
                    </td>

                    <td>

                        <button
                            class="approve-btn"
                            onclick="updateStatus(${booking.id}, 'Approved')">
                            Approve
                        </button>

                        <button
                            class="reject-btn"
                            onclick="updateStatus(${booking.id}, 'Rejected')">
                            Reject
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteBooking(${booking.id})">
                            Delete
                        </button>

                    </td>

                </tr>
            `;
        });

        document.getElementById("totalBookings").innerText =
            bookings.length;

        document.getElementById("pendingBookings").innerText =
            pendingCount;

        document.getElementById("approvedBookings").innerText =
            approvedCount;

        document.getElementById("rejectedBookings").innerText =
            rejectedCount;

        populateFacilityFilter();
        renderCalendar();

    } catch(error){

        console.error(error);

        document.getElementById("bookingTable").innerHTML = `
            <tr>
                <td colspan="8" class="no-data">
                    Unable to load bookings
                </td>
            </tr>
        `;

        // still render an empty calendar so the section isn't broken
        allBookings = [];
        populateFacilityFilter();
        renderCalendar();
    }
}
async function updateStatus(id, status) {

    try {

        const response = await fetch(
            `/api/bookings/${id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: status
                })
            }
        );

        const result = await response.json();

        if(result.success){

            alert("Booking status updated successfully!");

            loadBookings();

        }else{

            alert(result.message);

        }

    } catch(error){

        console.error(error);

        alert("Unable to update booking status.");

    }
}

async function deleteBooking(id) {

    const confirmed = confirm(
        "Are you sure you want to permanently delete this booking? This cannot be undone."
    );

    if (!confirmed) return;

    try {

        const response = await fetch(
            `/api/bookings/${id}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if(result.success){

            alert("Booking deleted successfully!");

            loadBookings();

        }else{

            alert(result.message || "Unable to delete booking.");

        }

    } catch(error){

        console.error(error);

        alert("Unable to delete booking.");

    }
}

/* =========================================================
   CALENDAR LOGIC
   ========================================================= */

// Extract a booking's date as a local YYYY-MM-DD string, or null
function getBookingDateKey(booking){

    const raw = booking.booking_date || booking.start_date;

    if(!raw) return null;

    const d = new Date(raw);

    if(isNaN(d.getTime())) return null;

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function dateKey(year, month, day){
    return `${year}-${String(month + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

function populateFacilityFilter(){

    const select = document.getElementById("facilityFilter");
    const currentValue = select.value || "all";

    const facilities = Array.from(
        new Set(
            allBookings
                .map(b => b.facility)
                .filter(f => !!f)
        )
    ).sort();

    select.innerHTML = `<option value="all">All Facilities</option>`;

    facilities.forEach(f => {
        select.innerHTML += `<option value="${f}">${f}</option>`;
    });

    // preserve previous selection if it still exists
    if (facilities.includes(currentValue) || currentValue === "all") {
        select.value = currentValue;
    }
}

function changeMonth(delta){

    calendarDate.setMonth(calendarDate.getMonth() + delta);

    renderCalendar();

    // hide day detail panel when navigating
    document.getElementById("dayDetails").classList.remove("active");
}

function renderCalendar(){

    const grid = document.getElementById("calendarGrid");
    const monthLabel = document.getElementById("calendarMonthLabel");
    const facilityFilter = document.getElementById("facilityFilter").value;

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    const monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
    ];

    monthLabel.innerText = `${monthNames[month]} ${year}`;

    // Build a lookup: dateKey -> { approved: [], pending: [], rejectedOnly: bool }
    const dayMap = {};

    allBookings.forEach(booking => {

        if (facilityFilter !== "all" && booking.facility !== facilityFilter) {
            return;
        }

        const key = getBookingDateKey(booking);

        if (!key) return;

        const status = (booking.status || "pending").toLowerCase();

        if (!dayMap[key]) {
            dayMap[key] = { approved: [], pending: [], rejected: [] };
        }

        if (status === "approved") {
            dayMap[key].approved.push(booking);
        } else if (status === "rejected") {
            dayMap[key].rejected.push(booking);
        } else {
            dayMap[key].pending.push(booking);
        }
    });

    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay(); // 0 = Sunday
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    let html = "";

    dayNames.forEach(name => {
        html += `<div class="calendar-day-name">${name}</div>`;
    });

    // leading empty cells
    for (let i = 0; i < startWeekday; i++) {
        html += `<div class="calendar-cell empty"></div>`;
    }

    const today = new Date();
    const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

    for (let day = 1; day <= daysInMonth; day++) {

        const key = dateKey(year, month, day);
        const info = dayMap[key];

        let cellClass = "day-free";
        let countHtml = "Available";
        let clickable = false;

        if (info && info.approved.length > 0) {
            cellClass = "day-booked";
            countHtml = `${info.approved.length} booked`;
            if (info.pending.length > 0) {
                countHtml += `, ${info.pending.length} pending`;
            }
            clickable = true;
        } else if (info && info.pending.length > 0) {
            cellClass = "day-pending";
            countHtml = `${info.pending.length} pending`;
            clickable = true;
        }

        const isToday = key === todayKey ? " today" : "";

        html += `
            <div class="calendar-cell ${cellClass}${isToday}" ${clickable ? `onclick="showDayDetails('${key}')"` : ""}>
                <div class="calendar-date-num">${day}</div>
                <div class="calendar-day-count">${countHtml}</div>
            </div>
        `;
    }

    grid.innerHTML = html;

    // stash the map for the click handler
    window._calendarDayMap = dayMap;
}

function showDayDetails(key){

    const info = window._calendarDayMap ? window._calendarDayMap[key] : null;

    const panel = document.getElementById("dayDetails");
    const title = document.getElementById("dayDetailsTitle");
    const list = document.getElementById("dayDetailsList");

    if (!info) {
        panel.classList.remove("active");
        return;
    }

    const items = [...info.approved, ...info.pending];

    title.innerText = `Bookings on ${key}`;

    list.innerHTML = items.map(b => `
        <li>
            <strong>${b.facility || "-"}</strong> — ${b.name || "-"}
            (${b.status || "Pending"})
            ${b.booking_ref ? ` · Ref: ${b.booking_ref}` : ""}
        </li>
    `).join("");

    panel.classList.add("active");
}

loadBookings();

</script>

</body>
</html>
